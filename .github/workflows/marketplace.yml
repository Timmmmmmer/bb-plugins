# Keep marketplace.json in sync with the plugins in this repository, however
# they were added (bb hub plugin add, an upload on GitHub, or a plain push).
name: Update marketplace.json

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "groups/**"
      - "packages.json"
      - "scripts/build-marketplace.mjs"
      - ".github/workflows/marketplace.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build marketplace.json
        run: node scripts/build-marketplace.mjs
      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain -- marketplace.json 'groups/*/marketplace.json')" ]; then
            echo "every marketplace.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add marketplace.json groups/*/marketplace.json
          git commit -m "Update marketplace.json"
          git pull --rebase origin main
          git push
